# Pages CMS content model for epidetective.com
#
# Every key in i18n/*.json is declared here on purpose: Pages CMS rebuilds each
# file from the fields it knows about, so an undeclared key would be dropped on
# save. Field names are used as literal JSON keys, which is why the dots survive.
#
# Types are string/text throughout. rich-text would rewrite the 22 values that
# carry inline HTML (<b>, <em>, &middot;) and break them.
#
# Generated from i18n/en.json -- regenerate rather than hand-editing.

media: assets

content:
  - name: en
    label: "English"
