var LANG_LIST = [["en","EN"],["zh","中文"]];
function pick(o,lang){ return o[lang] != null ? o[lang] : o.en; }

function noteText(item, S){
  var bits = [];
  if (item.note === "lead") bits.push(S.lead);
  if (item.note === "coauthor") bits.push(S.coauthor);
  if (item.sel) bits.push(S.selected);
  if (item.note === "preview") bits.push(S.preview);
  if (item.note === "upcoming") bits.push(S.upcoming);
  return bits.length ? " · " + bits.join(" · ") : "";
}

function build(lang){
  var S = STRINGS[lang];
  document.body.classList.toggle("zh", lang === "zh");
  document.documentElement.lang = lang;

  var nav = document.getElementById("langNav");
  nav.innerHTML = "";
  LANG_LIST.forEach(function(pair){
    var b = document.createElement("button");
    b.type = "button"; b.textContent = pair[1];
    b.setAttribute("lang", pair[0]);
    if (pair[0] === lang) b.setAttribute("aria-current","true");
    b.addEventListener("click", function(){ setLang(pair[0]); });
    nav.appendChild(b);
  });

  document.getElementById("backLink").textContent = S.back;
  document.getElementById("eyebrow").textContent = S.eyebrow;
  document.getElementById("h1").innerHTML = S.h1;
  document.getElementById("lede").innerHTML = S.lede;
  document.getElementById("key1").innerHTML = S.key1;
  document.getElementById("key2").innerHTML = S.key2;

  /* counts */
  var counts = {all:0};
  GROUPS.forEach(function(g){ g.items.forEach(function(it){
    counts.all++; counts[it.k] = (counts[it.k]||0) + 1; }); });

  var filters = document.getElementById("filters");
  filters.innerHTML = "";
  ["all","paper","tool","role","milestone","talk","press"].forEach(function(k){
    var b = document.createElement("button");
    b.className = "chip" + (k==="all" ? " active" : "");
    b.setAttribute("data-k", k);
    b.innerHTML = S.cats[k] + ' <span class="n">' + (counts[k]||0) + '</span>';
    b.addEventListener("click", function(){ filter(k, b); });
    filters.appendChild(b);
  });
  var view = document.createElement("div");
  view.className = "view";
  var vlabel = document.createElement("span");
  vlabel.className = "vlabel";
  vlabel.textContent = S.viewLabel;
  view.appendChild(vlabel);
  var seg = document.createElement("div");
  seg.className = "seg";
  [["compact", S.viewCompact], ["full", S.viewFull]].forEach(function(pair){
    var b = document.createElement("button");
    b.className = "seg-btn" + (mode===pair[0] ? " active" : "");
    b.setAttribute("data-mode", pair[0]);
    b.textContent = pair[1];
    b.addEventListener("click", function(){ setMode(pair[0]); });
    seg.appendChild(b);
  });
  view.appendChild(seg);
  filters.appendChild(view);

  var tl = document.getElementById("tl");
  tl.innerHTML = "";
  GROUPS.forEach(function(g){
    var yg = document.createElement("div");
    yg.className = "yeargroup" + (g.cls ? " " + g.cls : "");
    var itemsHtml = g.items.map(function(it){
      var links = it.links.map(function(l){
        var ext = /^https?:/.test(l[1]) ? ' rel="noopener"' : '';
        return '<a href="' + l[1] + '"' + ext + '>' + pick(l[0],lang) + '</a>';
      }).join("");
      return '<article class="item' + (it.sel ? ' sel' : '') + '" data-k="' + it.k + '">' +
        '<span class="tog" aria-hidden="true">+</span>' +
        '<div class="head">' +
        '<div class="meta">' + pick(it.date,lang) + ' · <b>' + S.kinds[it.k] + '</b>' + noteText(it, S) + '</div>' +
        '<h3><button type="button" aria-expanded="false">' + pick(it.t,lang) + '</button></h3>' +
        '</div>' +
        '<div class="body"><div class="inner">' +
        '<p>' + pick(it.d,lang) + '</p>' +
        (links ? '<div class="links">' + links + '</div>' : '') +
        '</div></div>' +
        '</article>';
    }).join("");
    var ytag = g.tag ? ' <span class="ytag">' + pick(g.tag,lang) + '</span>' : '';
    yg.innerHTML = '<div class="year">' + pick(g.y,lang) + ytag + '</div><div class="items">' + itemsHtml + '</div>';
    tl.appendChild(yg);
  });

  document.querySelectorAll(".item .head").forEach(function(h){
    h.addEventListener("click", function(){
      if (mode === "full") return;
      var it = h.closest(".item");
      var open = it.classList.toggle("open");
      it.querySelector(".tog").textContent = open ? "\u2212" : "+";
      it.querySelector("h3 button").setAttribute("aria-expanded", open ? "true" : "false");
    });
  });
  applyMode();
}

function applyMode(){
  document.body.classList.toggle("mode-compact", mode === "compact");
  document.body.classList.toggle("mode-full", mode === "full");
  document.querySelectorAll(".seg-btn").forEach(function(b){
    b.classList.toggle("active", b.getAttribute("data-mode") === mode);
  });
}

function setMode(m){
  if (m === mode) return;
  mode = m;
  try { localStorage.setItem("tl-mode", mode); } catch(e){}
  applyMode();
}

function filter(k, chip){
  document.querySelectorAll("#filters .chip").forEach(function(x){
    x.classList.toggle("active", x === chip);
  });
  document.querySelectorAll(".item").forEach(function(it){
    it.classList.toggle("hide", k !== "all" && it.getAttribute("data-k") !== k);
  });
  document.querySelectorAll(".yeargroup").forEach(function(g){
    g.style.display = g.querySelectorAll(".item:not(.hide)").length ? "" : "none";
  });
}

var VALID = ["en","zh"];
var lang = "en";
var mode = "compact";
try {
  var m0 = localStorage.getItem("tl-mode");
  if (m0 === "full" || m0 === "compact") mode = m0;
} catch(e){}
try {
  var q = new URLSearchParams(location.search).get("lang");
  var stored = null;
  try { stored = localStorage.getItem("tl-lang"); } catch(e){}
  if (q && VALID.indexOf(q) >= 0){
    lang = q;
    try { localStorage.setItem("tl-lang", lang); } catch(e){}
  } else if (stored && VALID.indexOf(stored) >= 0){
    lang = stored;
  }
} catch(e){}

function setLang(l){
  if (VALID.indexOf(l) < 0 || l === lang) return;
  lang = l;
  try { localStorage.setItem("tl-lang", lang); } catch(e){}
  build(lang);
}

build(lang);
</script>
